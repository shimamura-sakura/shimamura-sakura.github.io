<!doctype html>
<html>
<meta charset="utf-8" />
<title>Tyrano ASAR Loader</title>

<body>
  <h1>Tyrano ASAR Loader</h1>
  <p>
    选择一个或多个ASAR文件，然后点击"GO!"启动Tyrano.<br />
    后添加的文件覆盖先添加的文件。刷新页面清除已加载的ASAR文件。<br />
    程序会尝试自动将更新文件后加载，如顺序有误，请手动分多次添加。<br />
    Tyrano游戏存档存于浏览器中，清除网站数据会清除存档。<br />
    <input type="button" value="GO!" id="ldGo" disabled autocomplete="off" /><!--
    --><input type="file" multiple id="ldFile" autocomplete="off" /><br />
    <textarea cols="80" rows="25" id="ldLog" placeholder="日志" readonly></textarea>
  </p>
  <script>(async () => {
      const allEntries = {};
      const logEle = document.getElementById('ldLog');
      const worker = (await navigator.serviceWorker.register('/sw.js')).active;
      function ldLog(s) { console.log(s); logEle.append(s, '\n'); }
      ldLog('Service Worker ok');
      async function fixConfigTJS() {
        const name = '/data/system/config.tjs', data = allEntries[name];
        if (!data) return;
        const text = typeof data === 'string' ? data : await data.text();
        const rSrc = 'configSave=file';
        if (text.indexOf(rSrc) < 0) return;
        allEntries[name] = text.replace(rSrc, 'configSave=webstorage_compressed');
        return true;
      }
      document.getElementById('ldFile').addEventListener('change', async ev => {
        const files = Array.from(ev.target.files).map(f => [
          f.name.match(/update|更新|アップデート/i) ? 1 : 0, f]).sort();
        ldLog(`-- 选择了${files.length}个文件 --`);
        console.log(files);
        for (const [_, file] of files) try {
          const [v0, v4, v8, vC] = new Uint32Array(await file.slice(0, 16).arrayBuffer());
          if (!(v0 == 4 && v4 == v8 + 4 && vC + 4 <= v8))
            ldLog(`${file.name}: 似乎不是ASAR文件`);
          else {
            const newEntries = {}, newCount = function rec(o, f, p) {
              let n = 0;
              for (const [k, { files, offset, size }] of Object.entries(f)) if (files)
                n += rec(o, files, p + k.toLowerCase() + '/');
              else {
                const off = v4 + 8 + parseInt(offset);
                o[p + k.toLowerCase()] = file.slice(off, off + size);
                n += 1;
              }
              return n;
            }(newEntries, JSON.parse(await file.slice(16, 16 + vC).text()).files, '/');
            Object.assign(allEntries, newEntries);
            ldLog(`${file.name}: 添加了 ${newCount} 个文件`);
            if (await fixConfigTJS()) ldLog(`${file.name}: 修改了/data/system/config.tjs`);
          }
        } catch (e) {
          ldLog(`${file.name}: 错误 ${e}`);
          console.log(e);
        }
        if ('/index.html' in allEntries) {
          document.getElementById('ldGo').disabled = false;
          ldLog('已有 index.html, 可点击 GO! 启动');
        }
      });
      document.getElementById('ldGo').addEventListener('click', async () => {
        const originalST = globalThis.setTimeout, timeouts = [];
        globalThis.setTimeout = (...args) => timeouts.push(args);
        const text = await (await fetch('/index.html')).text();
        const newdoc = new DOMParser().parseFromString(text, 'text/html');
        document.documentElement.replaceWith(newdoc.documentElement);
        const scripts = Array.from(document.querySelectorAll('script'));
        for (const oldScr of scripts) {
          console.log(oldScr);
          const hasSrc = oldScr.hasAttribute('src');
          const newScr = document.createElement('script');
          newScr.innerHTML = oldScr.innerHTML;
          if (hasSrc) newScr.setAttribute('src', oldScr.getAttribute('src'));
          const { promise, resolve, reject } = Promise.withResolvers();
          newScr.onload = () => resolve();
          newScr.onerror = () => reject();
          document.head.appendChild(newScr);
          document.head.removeChild(newScr);
          if (!hasSrc) resolve();
          await promise;
        }
        globalThis.setTimeout = originalST;
        for (const args of timeouts) originalST(...args);
      }, { once: true });
      navigator.serviceWorker.addEventListener('message', ev => {
        console.log(ev.data);
        if (ev.data.ruASAR) return ev.source.postMessage({ imASAR: true });
        if (ev.data.uuid) return ev.source.postMessage({ uuid: ev.data.uuid, reply: allEntries[ev.data.url] });
      });
    })();</script>
</body>

</html>
